name: Apollo API Smoke Test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apollo-api-smoke-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check secret is configured
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          if [ -z "$APOLLO_API_KEY" ]; then
            echo "::error::APOLLO_API_KEY is not configured in GitHub Actions repository secrets."
            exit 1
          fi
          echo "APOLLO_API_KEY secret is present."
      - name: Verify Apollo API authentication
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          set +x
          status=$(curl --silent --show-error --output /tmp/apollo-response.txt --write-out "%{http_code}" \
            --max-time 20 \
            --header "X-Api-Key: $APOLLO_API_KEY" \
            "https://api.apollo.io/api/v1/auth/health")
          echo "Apollo authentication endpoint HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Apollo authentication check failed. Response body suppressed to avoid leaking data."
            exit 1
          fi
          echo "Apollo API authentication check passed. No search, enrichment, or CRM-write endpoint was called."
